[project]
name = "aetherv"
version = "0.1.0"
description = "A self-updating vector database"
requires-python = ">=3.11"
dependencies = [
    "fastembed",
    "jax",
    "numpy",
    "polars",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aetherv"]
